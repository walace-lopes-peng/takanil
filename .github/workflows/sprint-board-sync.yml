name: "\U0001F5C2\uFE0F Sincronizar Sprint Board"

# Dispara quando qualquer issue ou PR muda de estado
on:
  issues:
    types:
      - opened
      - closed
      - reopened
      - labeled
      - unlabeled
      - milestoned
      - demilestoned
      - assigned
  pull_request:
    types:
      - opened
      - closed
      - reopened
      - ready_for_review
      - converted_to_draft
  # Permite rodar manualmente pela aba Actions
  workflow_dispatch: {}

# Permissoes minimas necessarias
permissions:
  issues: write
  pull-requests: read

# Evita runs paralelos: se duas issues fecharem ao mesmo tempo,
# a segunda espera a primeira terminar (nao cancela)
concurrency:
  group: sprint-board-sync
  cancel-in-progress: false

jobs:
  sync:
    name: "Atualizar issue #97"
    runs-on: ubuntu-latest

    # Nao atualiza o board se a issue que mudou for a propria #97
    # (evita loop infinito)
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'issues' && github.event.issue.number != 97)

    steps:
      - name: Reconstruir e publicar Sprint Board
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const BOARD_ISSUE = 97;
            const OWNER = context.repo.owner;
            const REPO  = context.repo.repo;

            // ─── Helpers ─────────────────────────────────────────────────────

            /** Busca o numero de um milestone pelo titulo exato */
            async function getMilestoneNumber(title) {
              const { data } = await github.rest.issues.listMilestones({
                owner: OWNER, repo: REPO,
                state: 'open', per_page: 100,
              });
              return data.find(m => m.title === title)?.number ?? null;
            }

            /** Busca issues abertas de um milestone (exclui PRs) */
            async function getIssuesByMilestone(milestoneNumber) {
              if (!milestoneNumber) return [];
              const { data } = await github.rest.issues.listForRepo({
                owner: OWNER, repo: REPO,
                milestone: milestoneNumber,
                state: 'open', per_page: 100,
              });
              // A API do GitHub retorna PRs junto com issues — filtramos
              return data.filter(i => !i.pull_request);
            }

            /** Busca issues abertas com a label "bloqueado" */
            async function getBlockedIssues() {
              const { data } = await github.rest.issues.listForRepo({
                owner: OWNER, repo: REPO,
                labels: 'bloqueado',
                state: 'open', per_page: 100,
              });
              return data.filter(i => !i.pull_request);
            }

            /** Busca PRs abertas */
            async function getOpenPRs() {
              const { data } = await github.rest.pulls.list({
                owner: OWNER, repo: REPO,
                state: 'open', per_page: 100,
              });
              return data;
            }

            /** Formata labels de uma issue como `label` */
            function fmtLabels(labels) {
              return labels.map(l => '`' + l.name + '`').join(' ') || '—';
            }

            /** Gera linhas da tabela de issues */
            function issueRows(issues, semLabels) {
              if (!issues.length) {
                return semLabels
                  ? '| — | _Nenhuma issue no backlog_ |'
                  : '| — | _Nenhuma issue_ | — |';
              }
              return issues.map(i => semLabels
                ? '| [#' + i.number + '](' + i.html_url + ') | [' + i.title + '](' + i.html_url + ') |'
                : '| [#' + i.number + '](' + i.html_url + ') | [' + i.title + '](' + i.html_url + ') | ' + fmtLabels(i.labels) + ' |'
              ).join('\n');
            }

            /** Gera linhas da tabela de PRs */
            function prRows(prs) {
              if (!prs.length) return '| — | _Nenhuma PR aberta_ | — |';
              return prs.map(pr => {
                const status = pr.draft ? 'Draft' : 'Aguardando review';
                return '| [#' + pr.number + '](' + pr.html_url + ') | [' + pr.title + '](' + pr.html_url + ') | ' + status + ' |';
              }).join('\n');
            }

            // ─── Buscar dados em paralelo ─────────────────────────────────────

            core.info('Buscando milestones...');
            const [numV092, numV093, numV11] = await Promise.all([
              getMilestoneNumber('v0.9.2 — Bugs e Acessibilidade'),
              getMilestoneNumber('v0.9.3 — Segurança e LGPD'),
              getMilestoneNumber('v1.1 — Backlog de funcionalidades'),
            ]);

            core.info('Buscando issues e PRs...');
            const [issues092, issues093, issues11, blocked, prs] = await Promise.all([
              getIssuesByMilestone(numV092),
              getIssuesByMilestone(numV093),
              getIssuesByMilestone(numV11),
              getBlockedIssues(),
              getOpenPRs(),
            ]);

            // ─── Montar corpo da issue ────────────────────────────────────────

            const agora = new Date().toLocaleString('pt-BR', {
              timeZone: 'America/Sao_Paulo',
              day: '2-digit', month: '2-digit', year: 'numeric',
              hour: '2-digit', minute: '2-digit',
            });

            // Detecta sprint atual pelo milestone com issues abertas
            const sprintAtual = issues092.length > 0
              ? 'v0.9.2 — Bugs e Acessibilidade'
              : issues093.length > 0
                ? 'v0.9.3 — Segurança e LGPD'
                : 'v1.1 — Backlog de funcionalidades';

            const linhas = [
              '<!-- Atualizado automaticamente pelo GitHub Actions — nao edite manualmente -->',
              '',
              '**Owner:** @' + OWNER,
              '**Sprint atual:** ' + sprintAtual,
              '**Ultima atualizacao:** ' + agora + ' (horario de Brasilia)',
              '',
              '---',
              '',
              '## Blockers',
              '',
              '> Issues que bloqueiam tudo e precisam ser resolvidas antes de qualquer outra coisa.',
              '',
              '| # | Titulo | Labels |',
              '|---|--------|--------|',
              blocked.length ? issueRows(blocked) : '| — | _Nenhum blocker ativo_ | — |',
              '',
              '---',
              '',
              '## Pull Requests',
              '',
              '| # | Titulo | Status |',
              '|---|--------|--------|',
              prRows(prs),
              '',
              '---',
              '',
              '## Up Next — v0.9.2 Bugs e Acessibilidade',
              '',
              '> Sprint ativo. Issues prontas para trabalhar.',
              '',
              '| # | Titulo | Labels |',
              '|---|--------|--------|',
              issueRows(issues092),
              '',
              '---',
              '',
              '## Proximo Sprint — v0.9.3 Seguranca e LGPD',
              '',
              '> Nao começar antes de fechar o v0.9.2.',
              '',
              '| # | Titulo | Labels |',
              '|---|--------|--------|',
              issueRows(issues093),
              '',
              '---',
              '',
              '## Backlog — v1.1 Funcionalidades Futuras',
              '',
              '> Trabalhar somente apos v1.0 estar lancada.',
              '',
              '| # | Titulo |',
              '|---|--------|',
              issueRows(issues11, true),
              '',
              '---',
              '',
              '_Atualizado automaticamente pelo sprint-board-sync · ' + agora + '_',
            ];

            const body = linhas.join('\n');

            // ─── Publicar no GitHub ───────────────────────────────────────────

            await github.rest.issues.update({
              owner: OWNER,
              repo: REPO,
              issue_number: BOARD_ISSUE,
              body,
            });

            core.info('Sprint Board atualizado!');
            core.info('Blockers:  ' + blocked.length);
            core.info('PRs:       ' + prs.length);
            core.info('v0.9.2:    ' + issues092.length + ' issues');
            core.info('v0.9.3:    ' + issues093.length + ' issues');
            core.info('Backlog:   ' + issues11.length + ' issues');
