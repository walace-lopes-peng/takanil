name: "\U0001F5C2\uFE0F Sincronizar Sprint Board"

# Dispara quando qualquer issue ou PR muda de estado
on:
  issues:
    types:
      - opened
      - closed
      - reopened
      - labeled
      - unlabeled
      - milestoned
      - demilestoned
      - assigned
  pull_request:
    types:
      - opened
      - closed
      - reopened
      - ready_for_review
      - converted_to_draft
  # Permite rodar manualmente pela aba Actions
  workflow_dispatch: {}

# Permissoes minimas necessarias
permissions:
  issues: write
  pull-requests: read

# Evita runs paralelos: se duas issues fecharem ao mesmo tempo,
# a segunda espera a primeira terminar (nao cancela)
concurrency:
  group: sprint-board-sync
  cancel-in-progress: false

jobs:
  sync:
    name: "Atualizar issue #97"
    runs-on: ubuntu-latest

    # Nao atualiza o board se a issue que mudou for a propria #97
    # (evita loop infinito)
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'pull_request' ||
      (github.event_name == 'issues' && github.event.issue.number != 97)

    steps:
      - name: Reconstruir e publicar Sprint Board
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const BOARD_ISSUE = 97;
            const OWNER = context.repo.owner;
            const REPO  = context.repo.repo;

            // ─── Helpers ─────────────────────────────────────────────────────

            /** Busca o numero de um milestone pelo prefixo da versão (ex: v0.10.1) */
            async function getMilestoneNumber(prefix) {
              const { data } = await github.rest.issues.listMilestones({
                owner: OWNER, repo: REPO,
                state: 'open', per_page: 100,
              });
              return data.find(m => m.title.startsWith(prefix))?.number ?? null;
            }

            /** Busca issues abertas de um milestone (exclui PRs) */
            async function getIssuesByMilestone(milestoneNumber) {
              if (!milestoneNumber) return [];
              const { data } = await github.rest.issues.listForRepo({
                owner: OWNER, repo: REPO,
                milestone: milestoneNumber,
                state: 'open', per_page: 100,
              });
              // A API do GitHub retorna PRs junto com issues — filtramos
              return data.filter(i => !i.pull_request);
            }

            /** Busca issues abertas com a label "bloqueado" */
            async function getBlockedIssues() {
              const { data } = await github.rest.issues.listForRepo({
                owner: OWNER, repo: REPO,
                labels: 'bloqueado',
                state: 'open', per_page: 100,
              });
              return data.filter(i => !i.pull_request);
            }

            /** Busca PRs abertas */
            async function getOpenPRs() {
              const { data } = await github.rest.pulls.list({
                owner: OWNER, repo: REPO,
                state: 'open', per_page: 100,
              });
              return data;
            }

            /** Formata labels de uma issue como `label` */
            function fmtLabels(labels) {
              return labels.map(l => '`' + l.name + '`').join(' ') || '—';
            }

            /** Gera linhas da tabela de issues */
            function issueRows(issues, semLabels) {
              if (!issues.length) {
                return semLabels
                  ? '| — | _Nenhuma issue no backlog_ |'
                  : '| — | _Nenhuma issue_ | — |';
              }
              return issues.map(i => semLabels
                ? '| [#' + i.number + '](' + i.html_url + ') | [' + i.title + '](' + i.html_url + ') |'
                : '| [#' + i.number + '](' + i.html_url + ') | [' + i.title + '](' + i.html_url + ') | ' + fmtLabels(i.labels) + ' |'
              ).join('\n');
            }

            /** Gera linhas da tabela de PRs */
            function prRows(prs) {
              if (!prs.length) return '| — | _Nenhuma PR aberta_ | — |';
              return prs.map(pr => {
                const status = pr.draft ? 'Draft' : 'Aguardando review';
                return '| [#' + pr.number + '](' + pr.html_url + ') | [' + pr.title + '](' + pr.html_url + ') | ' + status + ' |';
              }).join('\n');
            }

            // ─── Buscar dados dinamicamente ──────────────────────────────────

            core.info('Buscando todos os milestones abertos...');
            const { data: openMilestones } = await github.rest.issues.listMilestones({
              owner: OWNER, repo: REPO,
              state: 'open', per_page: 100,
            });

            // Ordena os milestones: SemVer crescente, Backlog sempre por último
            function extrairSemVer(m) {
              const match = m.title.match(/v?(\d+)\.(\d+)(?:\.(\d+))?/i);
              if (!match) return [999, 999, 999];
              return [parseInt(match[1]), parseInt(match[2]), parseInt(match[3] || 0)];
            }

            openMilestones.sort((a, b) => {
              const aIsBacklog = a.title.toLowerCase().includes('backlog');
              const bIsBacklog = b.title.toLowerCase().includes('backlog');
              if (aIsBacklog && !bIsBacklog) return 1;
              if (!aIsBacklog && bIsBacklog) return -1;

              const [majA, minA, patchA] = extrairSemVer(a);
              const [majB, minB, patchB] = extrairSemVer(b);
              if (majA !== majB) return majA - majB;
              if (minA !== minB) return minA - minB;
              return patchA - patchB;
            });

            core.info('Buscando issues dos milestones, blockers e PRs...');
            const [blocked, prs, ...milestonesIssues] = await Promise.all([
              getBlockedIssues(),
              getOpenPRs(),
              ...openMilestones.map(m => getIssuesByMilestone(m.number))
            ]);

            const milestonesData = openMilestones.map((m, idx) => ({
              milestone: m,
              issues: milestonesIssues[idx],
              isBacklog: m.title.toLowerCase().includes('backlog'),
            }));

            // ─── Montar corpo da issue ────────────────────────────────────────

            const agora = new Date().toLocaleString('pt-BR', {
              timeZone: 'America/Sao_Paulo',
              day: '2-digit', month: '2-digit', year: 'numeric',
              hour: '2-digit', minute: '2-digit',
            });

            // Detecta sprint atual pelo primeiro milestone não-backlog que possui issues
            const sprintAtivoObj = milestonesData.find(m => !m.isBacklog && m.issues.length > 0)
              || milestonesData.find(m => !m.isBacklog)
              || milestonesData[0];

            const sprintAtual = sprintAtivoObj ? sprintAtivoObj.milestone.title : 'Nenhum sprint ativo';

            const linhas = [
              '<!-- Atualizado automaticamente pelo GitHub Actions — nao edite manualmente -->',
              '',
              '**Owner:** @' + OWNER,
              '**Sprint atual:** ' + sprintAtual,
              '**Ultima atualizacao:** ' + agora + ' (horario de Brasilia)',
              '',
              '---',
              '',
              '## Blockers',
              '',
              '> Issues que bloqueiam tudo e precisam ser resolvidas antes de qualquer outra coisa.',
              '',
              '| # | Titulo | Labels |',
              '|---|--------|--------|',
              blocked.length ? issueRows(blocked) : '| — | _Nenhum blocker ativo_ | — |',
              '',
              '---',
              '',
              '## Pull Requests',
              '',
              '| # | Titulo | Status |',
              '|---|--------|--------|',
              prRows(prs),
              '',
              '---',
            ];

            // Renderiza cada milestone dinamicamente
            let encontrouSprintAtivo = false;
            let encontrouProximo = false;

            milestonesData.forEach(({ milestone, issues, isBacklog }) => {
              let headerTitulo = '';
              if (milestone.title === sprintAtual) {
                headerTitulo = `## Up Next — ${milestone.title}`;
                encontrouSprintAtivo = true;
              } else if (isBacklog) {
                headerTitulo = `## Backlog — ${milestone.title}`;
              } else if (encontrouSprintAtivo && !encontrouProximo) {
                headerTitulo = `## Proximo Sprint — ${milestone.title}`;
                encontrouProximo = true;
              } else {
                headerTitulo = `## ${milestone.title}`;
              }

              linhas.push('', headerTitulo, '');
              if (milestone.description) {
                linhas.push(`> ${milestone.description}`, '');
              }

              if (isBacklog) {
                linhas.push(
                  '| # | Titulo |',
                  '|---|--------|',
                  issueRows(issues, true)
                );
              } else {
                linhas.push(
                  '| # | Titulo | Labels |',
                  '|---|--------|--------|',
                  issueRows(issues)
                );
              }

              linhas.push('', '---');
            });

            linhas.push('', '_Atualizado automaticamente pelo sprint-board-sync · ' + agora + '_');

            const body = linhas.join('\n');

            // ─── Publicar no GitHub ───────────────────────────────────────────

            await github.rest.issues.update({
              owner: OWNER,
              repo: REPO,
              issue_number: BOARD_ISSUE,
              body,
            });

            core.info('Sprint Board atualizado com sucesso!');
            core.info('Blockers:  ' + blocked.length);
            core.info('PRs:       ' + prs.length);
            milestonesData.forEach(m => {
              core.info(`${m.milestone.title}: ${m.issues.length} issues`);
            });
